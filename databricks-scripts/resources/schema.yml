# Schema that holds every AI Gateway object this bundle creates.
resources:
  schemas:
    ai_gateway:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: AI Gateway model providers and model services for HomeFix (create-model-service bundle)
      grants:
        # The agent app's service principal must see the schema to call its model services.
        - principal: ${var.agent_principal}
          privileges:
            - USE_SCHEMA
